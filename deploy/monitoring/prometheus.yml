global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/onstage-alerts.yml

scrape_configs:
  - job_name: onstage
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: [onstage:8765]
    # Mount this file from the Prometheus secret store. Never commit the token.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/onstage_metrics_token
