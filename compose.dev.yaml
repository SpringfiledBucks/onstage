# Isolated synthetic development only. Production uses an independent PostgreSQL.
name: onstage-isolated-dev
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://onstage:isolated-development-only@db:5432/onstage
    ONSTAGE_PUBLIC_ORIGIN: http://localhost:8765
    ONSTAGE_FRONTEND_ORIGINS: http://localhost:8080
    ONSTAGE_ADMIN_ORIGINS: http://localhost:8081
    ONSTAGE_SECURE_COOKIE: "0"
    ONSTAGE_VERSION: isolated-development
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: onstage
      POSTGRES_PASSWORD: isolated-development-only
      POSTGRES_DB: onstage
    volumes:
      - development-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onstage -d onstage"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    profiles: ["maintenance"]
    command: ["python", "tools/database.py", "migrate"]
    restart: "no"
  app:
    <<: *app
    ports: ["127.0.0.1:8765:8765"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: web
    environment:
      ONSTAGE_API_ORIGIN: http://localhost:8765
      ONSTAGE_WS_ORIGIN: ws://localhost:8765
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [app]
  admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: admin
    environment:
      ONSTAGE_API_ORIGIN: http://localhost:8765
      ONSTAGE_WS_ORIGIN: ws://localhost:8765
    ports: ["127.0.0.1:8081:8080"]
    depends_on: [app]
volumes:
  development-postgres:
